version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roro
      POSTGRES_PASSWORD: roro
      POSTGRES_DB: roro_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ../apps/api
    environment:
      PORT: 4010
      DATABASE_URL: postgres://roro:roro@postgres:5432/roro_os
      REDIS_URL: redis://redis:6379
    ports:
      - "4010:4010"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ../apps/worker
    environment:
      API_BASE: http://api:4010
      REDIS_URL: redis://redis:6379
    depends_on:
      - api
      - redis

volumes:
  pgdata:
