<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roro OS Console</title>
    <style>
      body{font-family:Inter,system-ui,sans-serif;max-width:820px;margin:24px auto;padding:0 16px;background:#0b1020;color:#e5ecff}
      .card{background:#111a33;border:1px solid #27345f;border-radius:12px;padding:14px;margin-bottom:12px}
      input,button{padding:10px;border-radius:10px;border:1px solid #3a4a7d}
      input{width:75%;background:#0d1630;color:white}
      button{background:#5b6ee1;color:#fff;border:none}
      .row{display:flex;gap:8px}
      ul{list-style:none;padding:0}
      li{padding:8px 0;border-bottom:1px solid #223158}
    </style>
  </head>
  <body>
    <h1>Roro OS Command Console</h1>
    <div class="card">
      <div class="row">
        <input id="text" placeholder="Tell Roro what to do" />
        <button onclick="send()">Run</button>
      </div>
      <p id="status"></p>
    </div>
    <div class="card">
      <h3>Recent Commands</h3>
      <ul id="list"></ul>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const API = params.get('api') || localStorage.getItem('RORO_API_BASE') || 'http://127.0.0.1:4010';
      async function load(){
        const r=await fetch(`${API}/v1/commands`); const d=await r.json();
        const ul=document.getElementById('list'); ul.innerHTML='';
        d.items.forEach(x=>{const li=document.createElement('li'); li.textContent=`${x.status.toUpperCase()} • ${x.text}`; ul.appendChild(li);});
      }
      async function send(){
        const text=document.getElementById('text').value.trim(); if(!text) return;
        await fetch(`${API}/v1/commands`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userId:'rohith',text})});
        document.getElementById('status').textContent='Submitted';
        document.getElementById('text').value='';
        load();
      }
      setInterval(load,1200); load();
    </script>
  </body>
</html>
