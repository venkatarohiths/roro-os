<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roro OS Console</title>
    <style>
      body{font-family:Inter,system-ui,sans-serif;max-width:860px;margin:24px auto;padding:0 16px;background:#0b1020;color:#e5ecff}
      .card{background:#111a33;border:1px solid #27345f;border-radius:12px;padding:14px;margin-bottom:12px}
      input,button{padding:10px;border-radius:10px;border:1px solid #3a4a7d}
      input{background:#0d1630;color:white}
      #text{flex:1}
      #api{width:100%}
      button{background:#5b6ee1;color:#fff;border:none;cursor:pointer}
      .row{display:flex;gap:8px;align-items:center}
      ul{list-style:none;padding:0}
      li{padding:8px 0;border-bottom:1px solid #223158}
      .muted{opacity:.8;font-size:13px}
    </style>
  </head>
  <body>
    <h1>Roro OS Command Console</h1>

    <div class="card">
      <label class="muted">API Base URL (optional)</label>
      <div class="row" style="margin-top:8px">
        <input id="api" placeholder="https://your-api-host (leave empty for demo mode)" />
        <button onclick="saveApi()">Apply</button>
      </div>
      <p id="mode" class="muted"></p>
    </div>

    <div class="card">
      <div class="row">
        <input id="text" placeholder="Tell Roro what to do" />
        <button onclick="send()">Run</button>
      </div>
      <p id="status" class="muted"></p>
    </div>

    <div class="card">
      <h3>Recent Commands</h3>
      <ul id="list"></ul>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const apiInput = document.getElementById('api');
      const modeEl = document.getElementById('mode');
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('list');

      let API = params.get('api') || localStorage.getItem('RORO_API_BASE') || '';
      let useLocalDemo = false;

      function getLocalItems(){
        try { return JSON.parse(localStorage.getItem('RORO_DEMO_ITEMS')||'[]'); }
        catch { return []; }
      }
      function setLocalItems(items){
        localStorage.setItem('RORO_DEMO_ITEMS', JSON.stringify(items));
      }
      function render(items){
        listEl.innerHTML='';
        items.forEach(x=>{
          const li=document.createElement('li');
          li.textContent=`${x.status.toUpperCase()} • ${x.text}`;
          listEl.appendChild(li);
        });
      }
      function updateModeText(){
        if(useLocalDemo) modeEl.textContent='Mode: Demo (local, no backend connected)';
        else modeEl.textContent=`Mode: Live API (${API})`;
      }

      async function probeApi(){
        if(!API){ useLocalDemo = true; updateModeText(); return false; }
        try{
          const r = await fetch(`${API}/health`, { method:'GET' });
          useLocalDemo = !r.ok;
          updateModeText();
          return !useLocalDemo;
        }catch{
          useLocalDemo = true;
          updateModeText();
          return false;
        }
      }

      async function load(){
        if(useLocalDemo){ render(getLocalItems()); return; }
        try{
          const r=await fetch(`${API}/v1/commands`);
          const d=await r.json();
          render(d.items || []);
        }catch{
          useLocalDemo = true;
          updateModeText();
          statusEl.textContent = 'API unreachable. Switched to demo mode.';
          render(getLocalItems());
        }
      }

      async function send(){
        const text=document.getElementById('text').value.trim();
        if(!text) return;

        if(useLocalDemo){
          const items = getLocalItems();
          const id = Date.now().toString();
          const row = { id, text, status:'queued' };
          items.unshift(row);
          setLocalItems(items);
          render(items);
          statusEl.textContent='Submitted (demo mode)';
          document.getElementById('text').value='';

          setTimeout(()=>{
            const cur=getLocalItems();
            const r=cur.find(x=>x.id===id); if(r) r.status='running';
            setLocalItems(cur); render(cur);
          }, 600);
          setTimeout(()=>{
            const cur=getLocalItems();
            const r=cur.find(x=>x.id===id); if(r) r.status='done';
            setLocalItems(cur); render(cur);
          }, 1600);
          return;
        }

        try{
          await fetch(`${API}/v1/commands`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userId:'rohith',text})});
          statusEl.textContent='Submitted';
          document.getElementById('text').value='';
          load();
        }catch{
          statusEl.textContent='Send failed. Check API URL or use demo mode.';
        }
      }

      async function saveApi(){
        API = apiInput.value.trim();
        if(API) localStorage.setItem('RORO_API_BASE', API); else localStorage.removeItem('RORO_API_BASE');
        await probeApi();
        await load();
      }

      apiInput.value = API;
      probeApi().then(load);
      setInterval(load, 2000);
      window.saveApi = saveApi;
      window.send = send;
    </script>
  </body>
</html>
